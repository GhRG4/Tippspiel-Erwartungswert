const mkMd=n=>n===10?FIX.map((f,i)=>({id:'m10_'+i,home:f[0],away:f[1],info:f[2],o:['','',''],pt:['','','']}))
  :SP[n][1].split('|').map((x,i)=>{const [a,b]=x.split(' ');return{id:'m'+n+'_'+i,home:TM[a],away:TM[b],info:'',o:['','',''],pt:['','','']};});
function calc(m){
  const o=m.o.map(num);
  if(!o.every(x=>x>1))return null;
  const inv=o.map(x=>1/x),s=inv.reduce((a,b)=>a+b,0),p=inv.map(x=>x/s);
  const pt=m.pt.map(num);
  if(!pt.every(x=>x>0))return{p,margin:(s-1)*100,ev:null};
  const ev=p.map((x,i)=>x*pt[i]);
  const order=[0,1,2].sort((a,b)=>ev[b]-ev[a]);
  return{p,ev,margin:(s-1)*100,best:order[0],gap:ev[order[0]]-ev[order[1]]};

const KEYK='oddspapi-key-v1';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const REV=Object.fromEntries(Object.entries(TM).map(([k,v])=>[v,k]));
const PAT=[['BAY','bayern'],['BVB','dortmund'],['RBL','leipzig'],['STU','stuttgart'],['B04','leverkusen'],['SGE','frankfurt'],['SCF','freiburg'],['HOF','hoffenheim'],['FCA','augsburg'],['M05','mainz'],['UNI','union'],['KOE','koln|cologne'],['BMG','monchengladbach|gladbach'],['HSV','hamburg'],['SVW','bremen'],['S04','schalke'],['SVE','elversberg'],['SCP','paderborn']];
const codeOf=name=>{const n=String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const p=PAT.find(x=>new RegExp(x[1]).test(n));return p?p[0]:null;};
async function api(ep,params,key){
  const q=new URLSearchParams({apiKey:key,...params});
  for(let t=0;t<4;t++){
    const r=await fetch('https://api.oddspapi.io/v4/'+ep+'?'+q);
    if(r.status===429){await sleep(2200);continue;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }
  throw new Error('Zu viele Anfragen (429)');
}
function windowOf(n){
  const m=SP[n][0].match(/(\d{2})\.(\d{2})\.(\d{4})/),end=Date.UTC(+m[3],+m[2]-1,+m[1]);
  const iso=t=>new Date(t).toISOString();
  return[iso(end-5*864e5).slice(0,10)+'T00:00:00Z',iso(end+864e5).slice(0,10)];
}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.data&&typeof s.data==='object'&&Array.isArray(s.cu))return s;}catch(e){}
  return{tab:'md',sel:10,data:{},cu:[mk()]};
}
function App(){
  const [st,setSt]=useState(load);

  const [info,setInfo]=useState(false);
  const [key,setKey]=useState(()=>{try{return localStorage.getItem(KEYK)||'';}catch(e){return '';}});
  const [keyIn,setKeyIn]=useState('');
  const [busy,setBusy]=useState(false);
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}},[st]);
  const {tab,sel,data,cu}=st,put=p=>setSt({...st,...p});
  const cur=data[sel]||mkMd(sel);
  const setCur=l=>put({data:{...data,[sel]:l}});
  const setOdd=(n,id,o)=>setSt(p=>({...p,data:{...p.data,[n]:(p.data[n]||mkMd(n)).map(x=>x.id===id?{...x,o}:x)}}));
  const getOdds=async()=>{
    if(!key){setInfo(true);setMsg('Bitte zuerst den API-Schlüssel eintragen.');return;}
    setBusy(true);setMsg('Lade Spielplan …');
    try{
      const [from,to]=windowOf(sel);
      const fx=await api('fixtures',{tournamentId:35,from,to},key);
      const list=Array.isArray(fx)?fx:(fx&&fx.fixtures)||[];
      let ok=0;const miss=[];
      for(let i=0;i<cur.length;i++){
        const m=cur[i],ha=REV[m.home],aw=REV[m.away];
        const f=list.find(x=>codeOf(x.participant1Name)===ha&&codeOf(x.participant2Name)===aw);
        if(!f){miss.push(m.home+' – '+m.away+' (nicht gefunden)');continue;}
        setMsg('Lade Tipico-Quoten '+(i+1)+'/'+cur.length+' …');
        await sleep(1100);
        try{
          const d=await api('odds',{fixtureId:f.fixtureId,bookmakers:'tipico'},key);
          const oc=d.bookmakerOdds.tipico.markets['101'].outcomes;
          const pr=['101','102','103'].map(k=>oc[k].players['0'].price);
          if(!pr.every(x=>x>1))throw new Error('kein Preis');
          setOdd(sel,m.id,pr.map(x=>Number(x).toFixed(2).replace('.',',')));ok++;
        }catch(e){miss.push(m.home+' – '+m.away+' (kein Tipico-Preis)');}
      }
      setMsg(ok+' von '+cur.length+' Spielen aktualisiert.'+(miss.length?' Fehlt: '+miss.join('; ')+'.':''));
    }catch(e){
      setMsg('Abruf fehlgeschlagen: '+e.message+'. Prüfe den API-Schlüssel und die Internetverbindung.');
    }
    setBusy(false);
  };
  const legend=h('p',{className:'note'},'Je Feld: oben Quote, darunter Tippspiel-Punkte, klein der Erwartungswert. Grün = bester Tipp, gelb = knapp (Vorsprung unter 0,3).');
  return h('div',null,
    h('div',{className:'ttl'},h('h1',null,'Tippspiel-Rechner'),
      h('button',{className:'ibtn','aria-label':'Info zu den Quoten','aria-expanded':info,onClick:()=>setInfo(!info)},'i')),
    info&&h('div',{className:'card infobox'},
      h('b',null,'Quoten abrufen'),
      h('p',null,'Spieltag wählen und „Tipico-Quoten laden“ tippen. Die Seite holt die Tipico-Quote (1, X, 2) für jedes Spiel über OddsPapi und trägt sie ein. Deine Tippspiel-Punkte bleiben erhalten.'),
      h('b',null,'Aktualisieren'),
      h('p',null,'Einfach nochmal laden, am besten kurz vor Anpfiff. Das überschreibt die Quoten. Ein Spieltag verbraucht bis zu 10 der 250 kostenlosen Abrufe im Monat.'),
      h('b',null,'API-Schlüssel'),
      h('p',null,key?'Gespeichert in diesem Browser. Er wird nur an OddsPapi gesendet.':'Kostenlosen Schlüssel auf oddspapi.io erstellen und hier einfügen. Er bleibt nur in diesem Browser.'),
      h('div',{className:'row',style:{marginBottom:10}},
        h('input',{type:'password',value:keyIn,placeholder:key?'Neuer Schlüssel':'API-Schlüssel',autoComplete:'off',onChange:e=>setKeyIn(e.target.value),style:{textAlign:'left'}}),
        h('button',{onClick:()=>{const v=keyIn.trim();if(!v)return;try{localStorage.setItem(KEYK,v);}catch(e){}setKey(v);setKeyIn('');setMsg('Schlüssel gespeichert.');}},'Speichern'),
        key&&h('button',{onClick:()=>{try{localStorage.removeItem(KEYK);}catch(e){}setKey('');}},'Löschen')),
      h('b',null,'Selbst anpassen'),
      h('p',null,'Jede Quote lässt sich jederzeit von Hand überschreiben.'),
      h('button',{onClick:()=>setInfo(false)},'Schließen')),
    h('div',{className:'tabs'},
      h('button',{className:tab==='md'?'on':'',onClick:()=>put({tab:'md'})},'Bundesliga'),
      h('button',{className:tab==='cu'?'on':'',onClick:()=>put({tab:'cu'})},'Eigene Spiele')),
    tab==='md'?h('div',null,
      h('div',{className:'row',style:{marginBottom:10,flexWrap:'wrap'}},
        h('select',{value:sel,onChange:e=>{setMsg('');put({sel:+e.target.value});},'aria-label':'Spieltag'},
          Object.keys(SP).map(n=>h('option',{key:n,value:n},n+'. Spieltag · '+SP[n][0]))),
        h('button',{className:'primary',disabled:busy,onClick:getOdds},busy?'Lädt …':'Tipico-Quoten laden'),
        h('button',{onClick:()=>{setMsg('');setCur(mkMd(sel));},'aria-label':'Spieltag zurücksetzen'},'↺')),
      msg&&h('p',{className:'note',style:{marginTop:0,color:'var(--warn)'}},msg),
      h(Tbl,{rows:cur,fixed:true,set:n=>setCur(cur.map(x=>x.id===n.id?n:x))}),
      legend,
      h('p',{className:'note'},'Spielplan: DFL, Stand 02.07.2026, Anstoßzeiten können sich ändern. Quoten: Tipico über OddsPapi, ohne Gewähr. Alle Werte lassen sich überschreiben.'))
    :h('div',null,
      h(Tbl,{rows:cu,set:n=>put({cu:cu.map(x=>x.id===n.id?n:x)}),del:m=>put({cu:cu.length>1?cu.filter(x=>x.id!==m.id):[mk()]})}),
      h('div',{className:'row',style:{marginTop:10}},
        h('button',{className:'primary',onClick:()=>put({cu:[...cu,mk()]})},'Spiel hinzufügen'),
        h('button',{onClick:()=>put({cu:[mk()]})},'Leeren')),
      legend));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
