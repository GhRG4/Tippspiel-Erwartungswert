const PAT=[['BAY','bayern'],['BVB','dortmund'],['RBL','leipzig'],['STU','stuttgart'],['B04','leverkusen'],['SGE','frankfurt'],['SCF','freiburg'],['HOF','hoffenheim'],['FCA','augsburg'],['M05','mainz'],['UNI','union'],['KOE','koln|cologne'],['BMG','monchengladbach|gladbach'],['HSV','hamburg'],['SVW','bremen'],['S04','schalke'],['SVE','elversberg'],['SCP','paderborn']];
const codeOf=name=>{const n=String(name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const p=PAT.find(x=>new RegExp(x[1]).test(n));return p?p[0]:null;};
async function api(ep,params,key){
  const q=new URLSearchParams({apiKey:key,...params});
  for(let t=0;t<4;t++){
    const r=await fetch('https://api.oddspapi.io/v4/'+ep+'?'+q);
    if(r.status===429){await sleep(2200);continue;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }
  throw new Error('Zu viele Anfragen (429)');
}
function windowOf(n){
  const m=SP[n][0].match(/(\d{2})\.(\d{2})\.(\d{4})/),end=Date.UTC(+m[3],+m[2]-1,+m[1]);
  const iso=t=>new Date(t).toISOString();
  return[iso(end-5*864e5).slice(0,10)+'T00:00:00Z',iso(end+864e5).slice(0,10)];
}
const FXK='tippspiel-fx-v1';
async function fixturesFor(n,key,force){
  let c={};try{c=JSON.parse(localStorage.getItem(FXK))||{};}catch(e){}
  if(!force&&c[n]&&c[n].length)return c[n];
  const [from,to]=windowOf(n);
  const fx=await api('fixtures',{tournamentId:35,from,to},key);
  const arr=Array.isArray(fx)?fx:(fx&&fx.fixtures)||[];
  const list=arr.map(x=>({id:x.fixtureId,h:codeOf(x.participant1Name),a:codeOf(x.participant2Name)}));
  if(list.length){c[n]=list;try{localStorage.setItem(FXK,JSON.stringify(c));}catch(e){}}
  return list;
}
const fmtO=x=>Number(x).toFixed(2).replace('.',',');
async function oddsFor(id,key){
  const d=await api('odds',{fixtureId:id,bookmakers:'tipico,pinnacle'},key);
  const bo=d.bookmakerOdds||{};
  const get=slug=>{try{
    const oc=bo[slug].markets['101'].outcomes;
    const pl=['101','102','103'].map(k=>oc[k].players['0']);
    if(pl.some(x=>x.active===false||!(x.price>1)))return null;
    return pl.map(x=>fmtO(x.price));
  }catch(e){return null;}};
  const t=get('tipico');
  if(!t)throw new Error('kein Tipico-Preis');
  return{t,p:get('pinnacle')};
}
const HK='tippspiel-hist-v1';

const saveH=H=>{try{localStorage.setItem(HK,JSON.stringify(H));}catch(e){}};
const mkey=(n,m)=>n+'|'+REV[m.home]+'-'+REV[m.away];
const full=a=>Array.isArray(a)&&a.length===3&&a.every(x=>num(x)>1);
const fullP=a=>Array.isArray(a)&&a.length===3&&a.every(x=>num(x)>0);
function snapH(n,m,o,po,pt){
  if(!full(o)||!REV[m.home]||!REV[m.away])return;
  const H=loadH(),k=mkey(n,m);
  const e=H[k]||{md:n,home:m.home,away:m.away,snaps:[],res:null};
  const sn={t:Date.now(),o:o.slice(),po:full(po)?po.slice():['','',''],pt:(pt||['','','']).slice()};
  const l=e.snaps[e.snaps.length-1];
  if(l&&JSON.stringify([l.o,l.po,l.pt])===JSON.stringify([sn.o,sn.po,sn.pt]))l.t=sn.t;
  else{e.snaps.push(sn);if(e.snaps.length>30)e.snaps.shift();}
  H[k]=e;saveH(H);
}
const probOf=o=>{const i=o.map(x=>1/num(x)),s=i.reduce((a,b)=>a+b,0);return i.map(x=>x/s);};
const argmax=a=>a.indexOf(Math.max(...a));
function evalH(H){
  const R={all:0,T:{n:0,pts:0,exp:0},P:{n:0,pts:0,exp:0},F:{n:0,pts:0,exp:0}};
  Object.values(H).forEach(e=>{
    if(e.res!==0&&e.res!==1&&e.res!==2)return;
    let s=null;for(let i=e.snaps.length-1;i>=0;i--){if(full(e.snaps[i].o)&&fullP(e.snaps[i].pt)){s=e.snaps[i];break;}}
    if(!s)return;
    R.all++;
    const pt=s.pt.map(num),pT=probOf(s.o),evT=pT.map((p,i)=>p*pt[i]);
    const add=(k,tip,ev)=>{R[k].n++;R[k].pts+=tip===e.res?pt[tip]:0;R[k].exp+=ev[tip];};
    add('T',argmax(evT),evT);
    const od=s.o.map(num);add('F',od.indexOf(Math.min(...od)),evT);
    if(full(s.po)){const pP=probOf(s.po),evP=pP.map((p,i)=>p*pt[i]);add('P',argmax(evP),evP);}
  });
  return R;
}
async function resultsFor(n){
  const r=await fetch('https://api.openligadb.de/getmatchdata/bl1/2026/'+n);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  return(Array.isArray(d)?d:[]).map(x=>{
    let res=null,sc=null;
    if(x.matchIsFinished){
      const mr=x.matchResults||[];
      const f=mr.find(y=>y.resultTypeID===2)||mr.slice().sort((a,b)=>(b.resultOrderID||0)-(a.resultOrderID||0))[0];
      if(f&&f.pointsTeam1>=0&&f.pointsTeam2>=0){sc=[f.pointsTeam1,f.pointsTeam2];res=sc[0]>sc[1]?0:sc[0]<sc[1]?2:1;}
    }
    return{t1:x.team1&&x.team1.teamName,t2:x.team2&&x.team2.teamName,res,sc};
  });
}
function csvH(H){
  const rows=[['Spieltag','Heim','Gast','Stand','Tipico1','TipicoX','Tipico2','Pinnacle1','PinnacleX','Pinnacle2','Punkte1','PunkteX','Punkte2','Ergebnis','Tore']];
  Object.values(H).sort((a,b)=>a.md-b.md).forEach(e=>{const s=e.snaps[e.snaps.length-1];if(!s)return;
    rows.push([e.md,e.home,e.away,new Date(s.t).toISOString().slice(0,16).replace('T',' ')].concat(s.o,s.po,s.pt,[e.res==null?'':TAGS[e.res],e.sc?e.sc[0]+':'+e.sc[1]:'']));});
  return rows.map(r=>r.join(';')).join('\n');
}

      h('div',{className:'row',style:{marginBottom:10}},
        h('input',{type:'password',value:keyIn,placeholder:key?'Neuer Schlüssel':'API-Schlüssel',autoComplete:'off',onChange:e=>setKeyIn(e.target.value),style:{textAlign:'left'}}),
        h('button',{onClick:()=>{const v=keyIn.trim();if(!v)return;try{localStorage.setItem(KEYK,v);}catch(e){}setKey(v);setKeyIn('');setMsg('Schlüssel gespeichert.');}},'Speichern'),
        key&&h('button',{onClick:()=>{try{localStorage.removeItem(KEYK);}catch(e){}setKey('');}},'Löschen')),
      h('b',null,'Spieltag zurücksetzen'),
      h('p',null,'Löscht alle Quoten und Punkte von Spieltag '+sel+'. Die Quoten musst du danach neu laden.'),
      cr?h('div',{className:'row',style:{marginBottom:10}},
          h('button',{className:'danger',onClick:()=>{setMsg('');setCur(mkMd(sel));setCr(false);setInfo(false);}},'Ja, löschen'),
          h('button',{onClick:()=>setCr(false)},'Abbrechen'))
        :h('button',{style:{marginBottom:10},onClick:()=>setCr(true)},'Spieltag '+sel+' zurücksetzen'),
      h('b',null,'Hinweise'),
      h('p',null,'Spielplan laut DFL, Stand 02.07.2026, Anstoßzeiten können sich ändern. Quoten ohne Gewähr. Fehlermeldungen erscheinen oben über der Tabelle.'),
      h('button',{onClick:()=>{setInfo(false);setCr(false);}},'Schließen')),
    h('div',{className:'tabs'},
      h('button',{className:tab==='md'?'on':'',onClick:()=>{setMsg('');put({tab:'md'});}},'Bundesliga'),
      h('button',{className:tab==='cmp'?'on':'',onClick:()=>{setMsg('');put({tab:'cmp'});}},'Vergleich'),
      h('button',{className:tab==='hist'?'on':'',onClick:()=>{setMsg('');put({tab:'hist'});}},'Verlauf'),
      h('button',{className:tab==='cu'?'on':'',onClick:()=>{setMsg('');put({tab:'cu'});}},'Eigene')),
    tab==='md'?h('div',null,
      selEl,
      h('div',{className:'row act'},
        h('button',{className:'primary',disabled:busy,onClick:getOdds},icCloud,busy?'Lädt …':'Tipico-Quoten laden'),
        h('button',{onClick:()=>setPaste(!paste)},icClip,'Kicktipp-Quoten einfügen')),
      msg&&h('p',{className:'note',style:{marginTop:0,color:'var(--warn)'}},msg),
      paste&&h('div',{className:'card'},
        h('p',{className:'note',style:{marginTop:0}},'In Kicktipp die Spiele-Liste markieren, kopieren und hier einfügen. Die Seite erkennt den Spieltag selbst.'),
        h('textarea',{value:ptxt,rows:6,placeholder:'Hier einfügen …',onChange:e=>setPtxt(e.target.value)}),
        h('div',{className:'row',style:{marginTop:8}},
          h('button',{className:'primary',onClick:applyKt},'Übernehmen'),
          h('button',{onClick:()=>setPaste(false)},'Abbrechen'))),
      hasMk&&h('div',{className:'mkbar'},
        h('span',null,'Änderungen: ',h('b',{className:'up'},'▲ höher'),' ',h('b',{className:'dn'},'▼ niedriger'),' • gleich'),
        h('button',{className:'ld',onClick:clearMk},'Ausblenden')),
      h(Tbl,{rows:cur,fixed:true,lock:busy,onLoad:loadOne,set:n=>setCur(cur.map(x=>x.id===n.id?n:x))}),
      legend,
      h('p',{className:'note'},'Spielplan: DFL, Stand 02.07.2026, Anstoßzeiten können sich ändern. Quoten: Tipico über OddsPapi, ohne Gewähr. Alle Werte lassen sich überschreiben.'))
    :tab==='cmp'?cmpView
    :tab==='hist'?histView
    :h('div',null,
      h(Tbl,{rows:cu,set:n=>put({cu:cu.map(x=>x.id===n.id?n:x)}),del:m=>put({cu:cu.length>1?cu.filter(x=>x.id!==m.id):[mk()]})}),
      h('div',{className:'row',style:{marginTop:10}},
        h('button',{className:'primary',onClick:()=>put({cu:[...cu,mk()]})},'Spiel hinzufügen'),
        h('button',{onClick:()=>put({cu:[mk()]})},'Leeren')),
      legend));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
